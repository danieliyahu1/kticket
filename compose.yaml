services:
  app:
    build:
      context: .
    ports:
      - "3000:3000"
    environment:
      KASPANET: testnet10
      PORT: "3000"
      HOST: 0.0.0.0
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:?set TURSO_DATABASE_URL in .env}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_ORIGIN: ${AUTH_ORIGIN:-http://localhost:3000}
      AUTH_SESSION_TTL_MS: ${AUTH_SESSION_TTL_MS:-900000}
    restart: unless-stopped
