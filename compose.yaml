services:
  app:
    build:
      context: .
    ports:
      - "3000:3000"
    environment:
      KASPANET: testnet10
      PORT: "3000"
      HOST: 0.0.0.0
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:?set TURSO_DATABASE_URL in .env}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
    restart: unless-stopped
