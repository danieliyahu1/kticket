name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Build, lint, typecheck & test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # biome check enforces lint + formatting + the Uncle Bob craft ruleset
        # (function size/complexity, magic numbers, naming) configured in biome.json.
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
