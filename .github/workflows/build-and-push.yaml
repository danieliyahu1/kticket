# Builds the kticket Docker image and pushes it to ghcr.io on every push to main.
# Argo CD then deploys the pinned image SHA to the OCI k3s box (oci-k3s-starter).
#
# Oracle's Always Free tier is Ampere — ARM, aarch64. An amd64 image would pull,
# start, and fail with `exec format error`. This repo is PUBLIC, so GitHub's
# native ARM runners (`ubuntu-24.04-arm`) are free and much faster than QEMU
# emulation — important here because the Dockerfile builds the Rust `silverc`
# covenant compiler, which is slow under emulation.
name: build-and-push

on:
  push:
    branches: [main]
    paths-ignore:
      - deploy/**
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci
      - run: cargo build --release --manifest-path packages/kit/silverc/Cargo.toml
      - run: npm test
      - run: npm run build

  build:
    needs: verify
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write # lets GITHUB_TOKEN push to ghcr.io

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          # Tag with the commit SHA as well as `latest`. Deploy the SHA, not
          # `latest`: Kubernetes cannot tell that a moving tag changed, so
          # `latest` gives you a deployment that does not redeploy.
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-manifest:
    if: github.event_name != 'pull_request' && github.actor != 'github-actions[bot]'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Pin manifest to published image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE }}:sha-${{ github.sha }}
        run: |
          sed -i "s|^          image: .*|          image: ${IMAGE}|" deploy/deployment.yaml

      - name: Commit manifest handoff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/deployment.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore: pin image to ${GITHUB_SHA}"
          git push origin HEAD:main
