# Maps three OCI Vault entries into the `kticket-secrets` Kubernetes Secret that
# the Deployment reads. What is in Git is a NAME, never a value: the box proves
# its own identity (instance principal) to OCI and fetches the values at runtime.
#
# ⚠ The vault entry names follow instance_name (default k3s-01) and MUST match
# what you create in OCI Vault. See docs/rung-4-secrets.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kticket-secrets
  namespace: kticket
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: kticket-secrets
    creationPolicy: Owner
  data:
    - secretKey: turso-database-url
      remoteRef:
        key: k3s-01-kticket-turso-url
    - secretKey: turso-auth-token
      remoteRef:
        key: k3s-01-kticket-turso-token
    - secretKey: auth-secret
      remoteRef:
        key: k3s-01-kticket-auth-secret
