# Anonymous feedback delivery credentials, kept separate from the Secret the
# app needs to boot.
#
# These vault entries are optional: until both exist, the feedback endpoint
# still accepts and durably queues notes in Turso. A missing entry therefore
# only fails this sync, never the Turso/auth Secret that starts the pod.
#
# The vault entry names follow instance_name (default k3s-01) and MUST match
# what you create in OCI Vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kticket-feedback-secrets
  namespace: kticket
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: kticket-feedback-secrets
    creationPolicy: Owner
  data:
    - secretKey: telegram-feedback-bot-token
      remoteRef:
        key: k3s-01-kticket-telegram-feedback-bot-token
    - secretKey: telegram-feedback-chat-id
      remoteRef:
        key: k3s-01-kticket-telegram-feedback-chat-id
