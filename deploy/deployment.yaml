# kticket — Deployment. The API serves the built web SPA on port 3000.
#
# The image tag is the commit SHA (immutable) rather than `latest`: Kubernetes
# cannot tell that a moving tag changed, so `latest` would not redeploy on push.
# The build-and-push workflow tags every push to main with its SHA.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kticket
  namespace: kticket
spec:
  replicas: 1
  selector:
    matchLabels: { app: kticket }
  template:
    metadata:
      labels: { app: kticket }
    spec:
      containers:
        - name: app
          image: ghcr.io/danieliyahu1/kticket:sha-7cfb9c00fffb927daaf4e10a8aa2ba93ca6abe0f
          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: kticket-config

          # Secrets are mapped explicitly to the env names kticket expects
          # (envFrom would expose the raw secret keys like `turso-database-url`,
          # which are not valid env var names and wouldn't match TURSO_*/AUTH_*).
          # kticket is fail-closed: it refuses to boot without AUTH_SECRET.
          env:
            - name: TURSO_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kticket-secrets
                  key: turso-database-url
            - name: TURSO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kticket-secrets
                  key: turso-auth-token
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: kticket-secrets
                  key: auth-secret

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 30
