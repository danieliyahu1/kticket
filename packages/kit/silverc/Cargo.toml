[package]
name = "kticket-silverc"
version = "0.1.0"
edition = "2021"
license = "ISC"
rust-version = "1.94.0"

# Pinned silverscript-lang rev (KTK-88 A1). Bump deliberately with A7 CI check.
[dependencies]
silverscript-lang = { git = "https://github.com/kaspanet/silverscript", rev = "c7d17a15ac88610d013ec9ffffa9520aeb69929b" }
silverscript-abi = { git = "https://github.com/kaspanet/silverscript", rev = "c7d17a15ac88610d013ec9ffffa9520aeb69929b" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5.60", features = ["derive"] }
faster-hex = "0.10"

[dev-dependencies]
kaspa-consensus-core = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "a41a333b08848f41bf737b72592e463a6011b8ac" }
kaspa-txscript = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "a41a333b08848f41bf737b72592e463a6011b8ac" }
kaspa-txscript-errors = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "a41a333b08848f41bf737b72592e463a6011b8ac" }
kaspa-hashes = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "a41a333b08848f41bf737b72592e463a6011b8ac" }
secp256k1 = "0.29"
blake2b_simd = "1"
rand = "0.8"

[profile.release]
lto = true

